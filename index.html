<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Los Angeles Socioeconomic Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="topbar">
    <h1>Los Angeles Socioeconomic Map</h1>
    <p>Compare socioeconomic patterns across West, Central, and East LA</p>
  </header>

  <main class="app">
    <section id="map"></section>

    <aside class="sidebar">

      <div>
        <p class="legend-title">Poverty Level</p>
        <div class="legend-region">
          <div class="legend-row">
            <span class="legend-region-label">West LA</span>
            <div class="swatch-gradient west-grad"></div>
          </div>
          <div class="legend-row">
            <span class="legend-region-label">Central LA</span>
            <div class="swatch-gradient central-grad"></div>
          </div>
          <div class="legend-row">
            <span class="legend-region-label">North LA</span>
            <div class="swatch-gradient north-grad"></div>
          </div>
          <div class="legend-row">
            <span class="legend-region-label">East LA</span>
            <div class="swatch-gradient east-grad"></div>
          </div>
          <div class="legend-row">
            <span class="legend-region-label">South LA</span>
            <div class="swatch-gradient south-grad"></div>
          </div>
        </div>
        <div class="legend-axis">
          <span>Low poverty</span>
          <span>High poverty</span>
        </div>
      </div>

      <hr />

      <div>
        <p class="legend-title">Majority Housing Type</p>
        <div class="legend-housing">
          <div class="legend-row">
            <div class="swatch-stripe"></div>
            <span>Single-family</span>
          </div>
          <div class="legend-row">
            <div class="swatch-solid"></div>
            <span>Multi-family</span>
          </div>
        </div>
      </div>

      <hr />

      <div id="info" class="info">
        <h3>Select a neighborhood</h3>
        <p>Click on any neighborhood to see details.</p>
      </div>

    </aside>
  </main>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"></script>
  <script src="script.js"></script>
</body>

</html>
